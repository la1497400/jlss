<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欧洲本土订单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .table-container {
            max-height: 80vh;
            overflow-y: auto;
        }
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .filter-section {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col">
                <h1><i class="bi bi-globe-europe-africa"></i> 欧洲本土订单管理系统</h1>
                <p class="text-muted">实时订单数据查看与协作</p>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stats-card">
                    <h5>总订单数</h5>
                    <h2 id="total-orders">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    <h5>总销售额</h5>
                    <h2 id="total-sales">€0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                    <h5>总利润</h5>
                    <h2 id="total-profit">€0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                    <h5>店铺数量</h5>
                    <h2 id="total-shops">0</h2>
                </div>
            </div>
        </div>

        <!-- 筛选区域 -->
        <div class="filter-section">
            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">店铺筛选</label>
                    <select class="form-select" id="shop-filter">
                        <option value="">所有店铺</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">国家筛选</label>
                    <select class="form-select" id="country-filter">
                        <option value="">所有国家</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">发货状态</label>
                    <select class="form-select" id="status-filter">
                        <option value="">所有状态</option>
                        <option value="已完成">已完成</option>
                        <option value="待发货">待发货</option>
                        <option value="已发货">已发货</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">搜索订单</label>
                    <input type="text" class="form-control" id="search-input" placeholder="订单号、收件人姓名...">
                </div>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="table-container">
            <table class="table table-striped table-hover">
                <thead class="table-dark sticky-top">
                    <tr>
                        <th>订单ID</th>
                        <th>店铺</th>
                        <th>订单号</th>
                        <th>收件人</th>
                        <th>国家</th>
                        <th>销售价格</th>
                        <th>利润</th>
                        <th>发货状态</th>
                        <th>日期</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="orders-table">
                    <!-- 数据将通过JavaScript填充 -->
                </tbody>
            </table>
        </div>

        <!-- 加载提示 -->
        <div id="loading" class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-2">正在加载数据...</p>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑订单</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="edit-form">
                    <!-- 编辑表单将通过JavaScript填充 -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>
        // Supabase配置
        const supabaseUrl = 'https://jcfpcophbmuwbsbxkliv.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjZnBjb3BoYm11d2JzYnhrbGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5ODc4MTYsImV4cCI6MjA3OTU2MzgxNn0.Aqhce6LpyWgj44zbRb-lgrT9o9pJWvQ8Nfzg5blVIQA';
        
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            loadOrders();
            setupEventListeners();
        });

        async function loadOrders(filters = {}) {
            showLoading(true);
            
            try {
                let query = supabaseClient
                    .from('欧洲本土')
                    .select('*')
                    .order('日期', { ascending: false });

                // 应用筛选条件
                if (filters.shop) {
                    query = query.eq('店铺名称', filters.shop);
                }
                if (filters.country) {
                    query = query.eq('国家', filters.country);
                }
                if (filters.status) {
                    query = query.eq('发货状态', filters.status);
                }
                if (filters.search) {
                    query = query.or(`订单号.ilike.%${filters.search}%,收件人姓名.ilike.%${filters.search}%`);
                }

                const { data: orders, error } = await query;

                if (error) {
                    throw error;
                }

                displayOrders(orders);
                updateStatistics(orders);
                updateFilters(orders);
                showLoading(false);
                
            } catch (error) {
                console.error('加载数据失败:', error);
                showLoading(false);
                alert('加载数据失败: ' + error.message);
            }
        }

        function displayOrders(orders) {
            const tbody = document.getElementById('orders-table');
            tbody.innerHTML = '';

            orders.forEach(order => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${order.订单ID}</td>
                    <td>${order.店铺名称 || ''}</td>
                    <td>${order.订单号 || ''}</td>
                    <td>${order.收件人姓名 || ''}</td>
                    <td>${order.国家 || ''}</td>
                    <td>€${order.销售价格€ || 0}</td>
                    <td class="${order.利润€ >= 0 ? 'text-success' : 'text-danger'}">
                        €${order.利润€ || 0}
                    </td>
                    <td>
                        <span class="badge ${getStatusBadgeClass(order.发货状态)}">
                            ${order.发货状态 || '未知'}
                        </span>
                    </td>
                    <td>${formatDate(order.日期)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="editOrder(${order.订单ID})">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteOrder(${order.订单ID})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function getStatusBadgeClass(status) {
            switch(status) {
                case '已完成': return 'bg-success';
                case '已发货': return 'bg-primary';
                case '待发货': return 'bg-warning';
                default: return 'bg-secondary';
            }
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN');
        }

        function updateStatistics(orders) {
            const totalOrders = orders.length;
            const totalSales = orders.reduce((sum, order) => sum + (order.销售价格€ || 0), 0);
            const totalProfit = orders.reduce((sum, order) => sum + (order.利润€ || 0), 0);
            const uniqueShops = new Set(orders.map(order => order.店铺名称).filter(Boolean)).size;

            document.getElementById('total-orders').textContent = totalOrders.toLocaleString();
            document.getElementById('total-sales').textContent = '€' + totalSales.toFixed(2);
            document.getElementById('total-profit').textContent = '€' + totalProfit.toFixed(2);
            document.getElementById('total-shops').textContent = uniqueShops;
        }

        function updateFilters(orders) {
            // 更新店铺筛选选项
            const shopFilter = document.getElementById('shop-filter');
            const shops = [...new Set(orders.map(order => order.店铺名称).filter(Boolean))];
            
            shops.forEach(shop => {
                if (!Array.from(shopFilter.options).some(option => option.value === shop)) {
                    const option = document.createElement('option');
                    option.value = shop;
                    option.textContent = shop;
                    shopFilter.appendChild(option);
                }
            });

            // 更新国家筛选选项
            const countryFilter = document.getElementById('country-filter');
            const countries = [...new Set(orders.map(order => order.国家).filter(Boolean))];
            
            countries.forEach(country => {
                if (!Array.from(countryFilter.options).some(option => option.value === country)) {
                    const option = document.createElement('option');
                    option.value = country;
                    option.textContent = country;
                    countryFilter.appendChild(option);
                }
            });
        }

        function setupEventListeners() {
            // 筛选条件变化时重新加载数据
            document.getElementById('shop-filter').addEventListener('change', applyFilters);
            document.getElementById('country-filter').addEventListener('change', applyFilters);
            document.getElementById('status-filter').addEventListener('change', applyFilters);
            document.getElementById('search-input').addEventListener('input', applyFilters);
        }

        function applyFilters() {
            const filters = {
                shop: document.getElementById('shop-filter').value,
                country: document.getElementById('country-filter').value,
                status: document.getElementById('status-filter').value,
                search: document.getElementById('search-input').value
            };
            loadOrders(filters);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        async function editOrder(orderId) {
            // 获取订单详情并显示编辑表单
            const { data: order, error } = await supabaseClient
                .from('欧洲本土')
                .select('*')
                .eq('订单ID', orderId)
                .single();

            if (error) {
                alert('获取订单详情失败: ' + error.message);
                return;
            }

            const formHtml = `
                <form id="edit-order-form">
                    <input type="hidden" name="订单ID" value="${order.订单ID}">
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">发货状态</label>
                                <select class="form-select" name="发货状态">
                                    <option value="待发货" ${order.发货状态 === '待发货' ? 'selected' : ''}>待发货</option>
                                    <option value="已发货" ${order.发货状态 === '已发货' ? 'selected' : ''}>已发货</option>
                                    <option value="已完成" ${order.发货状态 === '已完成' ? 'selected' : ''}>已完成</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">订单状态</label>
                                <input type="text" class="form-control" name="订单状态" value="${order.订单状态 || ''}">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">物流公司</label>
                                <input type="text" class="form-control" name="物流公司" value="${order.物流公司 || ''}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">快递单号</label>
                                <input type="text" class="form-control" name="快递单号" value="${order.快递单号 || ''}">
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">备注</label>
                        <textarea class="form-control" name="订单状态" rows="3">${order.订单状态 || ''}</textarea>
                    </div>

                    <div class="text-end">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary">保存更改</button>
                    </div>
                </form>
            `;

            document.getElementById('edit-form').innerHTML = formHtml;
            
            // 显示模态框
            const modal = new bootstrap.Modal(document.getElementById('editModal'));
            modal.show();

            // 处理表单提交
            document.getElementById('edit-order-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                await updateOrder(this);
                modal.hide();
            });
        }

        async function updateOrder(form) {
            const formData = new FormData(form);
            const updates = Object.fromEntries(formData.entries());

            const { error } = await supabaseClient
                .from('欧洲本土')
                .update(updates)
                .eq('订单ID', updates.订单ID);

            if (error) {
                alert('更新失败: ' + error.message);
            } else {
                alert('更新成功!');
                loadOrders(); // 重新加载数据
            }
        }

        async function deleteOrder(orderId) {
            if (!confirm('确定要删除这个订单吗？此操作不可恢复。')) {
                return;
            }

            const { error } = await supabaseClient
                .from('欧洲本土')
                .delete()
                .eq('订单ID', orderId);

            if (error) {
                alert('删除失败: ' + error.message);
            } else {
                alert('删除成功!');
                loadOrders(); // 重新加载数据
            }
        }
    </script>
</body>
</html>
